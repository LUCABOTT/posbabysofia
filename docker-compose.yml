services:

  postgres:
    image: postgres:16-alpine
    container_name: posbabysofia-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - posbabysofia-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: posbabysofia-backend
    restart: unless-stopped

    ports:
      - "${API_PORT}:3000"

    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      FRONTEND_URL: http://localhost:5173

    volumes:
      - ./backend:/app
      - /app/node_modules

    depends_on:
      - postgres

    networks:
      - posbabysofia-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: posbabysofia-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@posbabysofia.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - postgres

    networks:
      - posbabysofia-network

volumes:
  postgres_data:

networks:
  posbabysofia-network:
    driver: bridge